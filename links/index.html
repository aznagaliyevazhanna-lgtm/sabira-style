<style>
  :root {
    --bg: #F6E3E0;
    --bg-2: #FBEFEC;
    --blush: #EFC9C4;
    --plum: #7A3F47;
    --plum-soft: #8E5A5F;
    --rose: #B8777A;
    --rose-light: #D9A9A4;
    --card: rgba(255, 249, 247, .78);
    --card-line: rgba(255, 255, 255, .9);
    --shadow: 0 10px 28px -12px rgba(150, 82, 86, .35), 0 2px 6px rgba(150, 82, 86, .08);
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Montserrat", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--serif);
    color: var(--plum);
    background-color: var(--bg);
    background-image:
      radial-gradient(60% 40% at 0% 30%, rgba(239, 190, 186, .55), transparent 70%),
      radial-gradient(50% 35% at 100% 70%, rgba(239, 190, 186, .5), transparent 70%),
      radial-gradient(80% 50% at 50% 0%, var(--bg-2), transparent 70%),
      linear-gradient(160deg, #F9EAE7 0%, #F4DCD8 55%, #F7E6E2 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    position: relative;
    font-variant-numeric: lining-nums;
  }

  /* ---------- декор ---------- */
  .deco { position: absolute; pointer-events: none; z-index: 0; color: var(--rose-light); }
  .deco--tl { top: -10px; left: -14px; width: 150px; }
  .deco--tr { top: 10px; right: -6px; width: 110px; transform: scaleX(-1); }
  .deco--bl { bottom: -8px; left: -12px; width: 140px; transform: scaleY(-1) rotate(10deg); }
  .deco--br { bottom: -6px; right: -12px; width: 150px; transform: scale(-1, -1); }
  .deco--ml { top: 34%; left: -22px; width: 80px; transform: rotate(-20deg); opacity: .75; }
  .deco--mr { top: 52%; right: -20px; width: 78px; transform: scaleX(-1) rotate(-15deg); opacity: .75; }
  .spark { position: absolute; width: 14px; color: var(--rose-light); pointer-events: none; z-index: 0; animation: twinkle 4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  /* ---------- страница ---------- */
  .page {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto;
    padding: 40px 18px 120px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  .logo {
    width: 196px; height: 196px; border-radius: 50%;
    filter: drop-shadow(0 14px 22px rgba(160, 90, 92, .22));
  }
  .name {
    margin-top: 18px;
    font-size: clamp(44px, 13vw, 58px); font-weight: 600; line-height: 1;
    color: var(--plum); letter-spacing: .005em;
  }
  .divider { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 260px; margin: 14px auto 10px; color: var(--rose); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--rose-light)); }
  .divider::after { background: linear-gradient(90deg, var(--rose-light), transparent); }
  .divider svg { width: 14px; height: 14px; flex: none; }
  .tagline { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .55em; padding-left: .55em; color: var(--plum-soft); }

  .address {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 22px; font-size: 19px; font-weight: 500; color: var(--plum);
    text-decoration: none;
  }
  .address svg { width: 20px; height: 20px; flex: none; color: var(--rose); }

  /* ---------- кнопки ---------- */
  .links { list-style: none; width: 100%; margin-top: 26px; display: grid; gap: 16px; }
  .card {
    display: grid; grid-template-columns: auto 1px 1fr auto; align-items: center; gap: 16px;
    padding: 16px 18px 16px 16px;
    text-align: left; text-decoration: none; color: inherit;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
    -webkit-tap-highlight-color: transparent;
    opacity: 0; animation: rise .6s ease forwards;
  }
  .links li:nth-child(2) .card { animation-delay: .08s; }
  .links li:nth-child(3) .card { animation-delay: .16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .card:hover, .card:focus-visible { transform: translateY(-2px); background: rgba(255, 251, 250, .95); box-shadow: 0 16px 32px -14px rgba(150, 82, 86, .45), 0 2px 6px rgba(150, 82, 86, .1); }
  .card:active { transform: scale(.985); }
  .card:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

  .card__icon {
    width: 62px; height: 62px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #FBEDEA, #F0D6D2);
    box-shadow: inset 0 1px 2px rgba(255, 255, 255, .9), 0 3px 8px -3px rgba(150, 82, 86, .3);
  }
  .card__icon svg { width: 36px; height: 36px; }
  .card__line { width: 1px; height: 44px; background: linear-gradient(transparent, var(--rose-light), transparent); }
  .card__title { display: block; font-size: 24px; font-weight: 600; letter-spacing: .02em; line-height: 1.1; text-transform: uppercase; }
  .card__sub { display: block; margin-top: 3px; font-size: 17px; font-weight: 500; color: var(--plum-soft); line-height: 1.25; }
  .card__arrow { width: 20px; height: 20px; color: var(--plum-soft); transition: transform .25s ease; }
  .card:hover .card__arrow { transform: translateX(3px); }

  /* ---------- низ ---------- */
  .divider--wide { max-width: 320px; margin-top: 30px; }
  .facts { list-style: none; margin-top: 12px; display: grid; gap: 10px; font-size: 18px; font-weight: 500; color: var(--plum-soft); }
  .facts li { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .facts svg { width: 26px; height: 22px; flex: none; color: var(--plum-soft); }

  .handle {
    display: inline-block; margin-top: 24px;
    padding: 9px 26px; border-radius: 999px;
    font-size: 20px; font-weight: 600; color: var(--plum); text-decoration: none;
    background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow);
    transition: transform .25s ease;
  }
  .handle:hover { transform: translateY(-1px); }
  .heart-end { width: 12px; height: 12px; margin-top: 8px; color: var(--rose); }

  @media (max-width: 380px) {
    .card { gap: 12px; padding: 14px 14px 14px 12px; }
    .card__icon { width: 54px; height: 54px; }
    .card__icon svg { width: 32px; height: 32px; }
    .card__title { font-size: 21px; }
    .card__sub { font-size: 15.5px; }
    .address { font-size: 17px; }
    .facts { font-size: 16.5px; }
  }
  @media (min-width: 700px) {
    .deco--tl { width: 220px; } .deco--tr { width: 160px; } .deco--bl { width: 200px; } .deco--br { width: 220px; }
    .deco--ml, .deco--mr { width: 120px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card { opacity: 1; }
  }
</style>
