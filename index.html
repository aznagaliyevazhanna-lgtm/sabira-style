<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SABIRA STYLE — мұсылман әйелдер киімі, Ақтау</title>
<meta name="description" content="SABIRA STYLE — орамал, шарф, хиджаб, буркини, абая. Ақтау және бүкіл Қазақстан бойынша жеткізу. Платки, шарфы, хиджабы, буркини, абаи — заказ через WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="SABIRA STYLE · Ақтау">
<meta property="og:description" content="Орамал, шарф, хиджаб, буркини, абая · Тапсырыс WhatsApp арқылы">
<meta property="og:url" content="https://aznagaliyevazhanna-lgtm.github.io/sabira-style/">
<meta property="og:image" content="https://aznagaliyevazhanna-lgtm.github.io/sabira-style/images/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FAF6F0">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="images/icon-180.png">
<meta name="apple-mobile-web-app-title" content="SABIRA STYLE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/><path d="M9.2 8.4c0 3 2.6 6.4 6.4 6.4l.9-1.4-2-1-1 .8c-1-.5-2-1.5-2.4-2.5l.8-1-1-2z"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 48 48"><path d="M30 6a18 18 0 1 0 12 30A15 15 0 1 1 30 6z"/><path d="M36 14l1.4 3.2 3.4.3-2.6 2.2.8 3.4-3-1.8-3 1.8.8-3.4-2.6-2.2 3.4-.3z" fill="currentColor" stroke="none"/></symbol>
</svg>

<header class="header" id="header">
  <div class="container header__in">
    <a href="#top" class="logo" aria-label="SABIRA STYLE">
      <svg class="logo__moon"><use href="#i-moon"/></svg>
      <span class="logo__text">SABIRA<small>STYLE</small></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#catalog" data-i18n="nav_catalog"></a>
      <a href="#new" data-i18n="nav_new"></a>
      <a href="#delivery" data-i18n="nav_delivery"></a>
      <a href="#contacts" data-i18n="nav_contacts"></a>
    </nav>
    <div class="header__actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="kz">KZ</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
      <a class="icon-btn" data-link="instagram" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-ig"/></svg></a>
      <a class="icon-btn" data-link="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp"><svg><use href="#i-wa"/></svg></a>
      <button type="button" class="icon-btn burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="container hero__in">
      <div class="hero__copy">
        <p class="kicker" data-i18n="hero_kicker"></p>
        <h1 class="hero__title" data-i18n="hero_title"></h1>
        <p class="hero__text" data-i18n="hero_text"></p>
        <div class="hero__btns">
          <a class="btn btn--wa" data-link="whatsapp" target="_blank" rel="noopener"><svg><use href="#i-wa"/></svg><span data-i18n="btn_wa"></span></a>
          <a class="btn btn--ghost" data-link="instagram" target="_blank" rel="noopener"><svg><use href="#i-ig"/></svg><span>@sabira_style</span></a>
        </div>
        <ul class="perks">
          <li data-i18n="perk_delivery"></li>
          <li data-i18n="perk_kaspi"></li>
          <li data-i18n="perk_quality"></li>
          <li data-i18n="address"></li>
        </ul>
      </div>
      <div class="arch" id="heroArch">
        <div class="arch__inner">
          <svg class="arch__moon"><use href="#i-moon"/></svg>
          <span class="arch__word">SABIRA</span>
          <span class="arch__sub">STYLE · AKTAU</span>
        </div>
      </div>
    </div>
  </section>

  <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>

  <section class="section" id="categories">
    <div class="container">
      <div class="head head--center">
        <p class="kicker" data-i18n="cats_kicker"></p>
        <h2 data-i18n="cats_title"></h2>
      </div>
      <div class="cats" id="cats"></div>
    </div>
  </section>

  <section class="section section--alt" id="new">
    <div class="container">
      <div class="head">
        <div><p class="kicker" data-i18n="new_kicker"></p><h2 data-i18n="new_title"></h2></div>
      </div>
      <div class="rail" id="newRail"></div>
    </div>
  </section>

  <section class="section" id="catalog">
    <div class="container">
      <div class="head">
        <div><p class="kicker" data-i18n="catalog_kicker"></p><h2 data-i18n="nav_catalog"></h2></div>
        <span class="found" id="found"></span>
      </div>
      <div class="chips" id="catChips"></div>
      <div class="chips chips--season" id="seasonChips"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="section section--alt" id="delivery">
    <div class="container">
      <div class="head"><div><p class="kicker" data-i18n="delivery_kicker"></p><h2 data-i18n="delivery_title"></h2></div></div>
      <div class="steps" id="steps"></div>
      <div class="info-cols">
        <div><h3 data-i18n="nav_delivery"></h3><div class="info-list" id="deliveryList"></div></div>
        <div><h3 data-i18n="payment"></h3><div class="info-list" id="paymentList"></div></div>
      </div>
    </div>
  </section>

  <section class="section" id="reviews" hidden>
    <div class="container">
      <div class="head head--center"><p class="kicker" data-i18n="reviews_kicker"></p><h2 data-i18n="reviews_title"></h2></div>
      <div class="reviews" id="reviewList"></div>
    </div>
  </section>

  <section class="section insta">
    <div class="container insta__in">
      <svg class="insta__icon"><use href="#i-ig"/></svg>
      <h2>@sabira_style</h2>
      <p data-i18n="insta_text"></p>
      <a class="btn btn--dark" data-link="instagram" target="_blank" rel="noopener" data-i18n="insta_btn"></a>
    </div>
  </section>

  <section class="section" id="contacts">
    <div class="container">
      <div class="head"><div><p class="kicker">Aktau</p><h2 data-i18n="nav_contacts"></h2></div></div>
      <div class="contacts" id="contactsList"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer__in">
    <a href="#top" class="logo logo--light" aria-label="SABIRA STYLE">
      <svg class="logo__moon"><use href="#i-moon"/></svg>
      <span class="logo__text">SABIRA<small>STYLE</small></span>
    </a>
    <p class="footer__tag" data-i18n="footer_tag"></p>
    <div class="footer__social">
      <a data-link="instagram" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-ig"/></svg></a>
      <a data-link="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp"><svg><use href="#i-wa"/></svg></a>
      <a data-link="phone" aria-label="Phone"><svg><use href="#i-phone"/></svg></a>
    </div>
    <p class="footer__copy">© <span id="year"></span> SABIRA STYLE · <span data-i18n="city"></span></p>
  </div>
</footer>

<a class="wa-float" data-link="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp"><svg><use href="#i-wa"/></svg></a>

<div class="overlay" id="overlay" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
  <button type="button" class="modal__close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="modalBody"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
